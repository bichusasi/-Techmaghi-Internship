<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analyzer</title>

    <link rel="stylesheet" href="Sentiment_Analyser.css">
</head>
<body>

<div class="container">

    <h1>😊 Sentiment Analyzer</h1>

    <textarea
        id="textInput"
        placeholder="Type your sentence here..."
    ></textarea>

    <button onclick="analyzeSentiment()">
        Analyze
    </button>

    <div class="result">

        <h2>Result</h2>

        <p id="output">
            Enter text and click Analyze.
        </p>

    </div>

</div>

<script src="Sentiment_Analyser.js"></script>

</body>
</html>
