<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpamShield</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='SpamShield.css') }}">
</head>

<body>

    <div class="container">

        <h1>🛡 SpamShield</h1>

        <p>Simple Spam Detection Web App</p>

        <button onclick="checkSpam()">Detect Spam</button>

            <p id="score"></p>

            <p id="words"></p>

        </div>

    </div>

    <script src="{{ url_for('static', filename='SpamShield.js') }}"></script>

</body>
</html>
